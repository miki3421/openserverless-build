// Run only the named existing suites. Gradle --tests alone still constructs
// unrelated ScalaTest/JUnit suites, whose shared remoting port then collides.
// This init script changes test setup only, not the production configuration.
gradle.projectsEvaluated {
    def tests = rootProject.project(':tests')
    tests.tasks.named('testUnit').configure {
        setIncludes([
            '**/WhiskPodBuilderTests.class',
            '**/Fabric8ClientTests.class',
            '**/KubernetesClientTests.class',
            '**/KafkaMetricsTests.class',
            '**/WebActionsApiTests.class',
            '**/CloudFrontSignerTests.class'
        ] as Set)
        systemProperty 'akka.remote.artery.canonical.port', '0'
        systemProperty 'akka.remote.artery.bind.port', '0'
        environment 'RUNTIMES_MANIFEST', new File(rootProject.projectDir, 'ansible/files/runtimes.json').text
        environment 'KAFKA_HOSTS', '127.0.0.1:1'
        environment 'EDGE_HOST', 'synthetic.invalid'
        environment 'EDGE_HOST_APIPORT', '443'
        environment 'WHISK_API_HOST_NAME', 'synthetic.invalid'
        environment 'LIMITS_ACTIONS_INVOKES_PERMINUTE', '1000'
        environment 'LIMITS_ACTIONS_INVOKES_CONCURRENT', '100'
        environment 'LIMITS_TRIGGERS_FIRES_PERMINUTE', '1000'
        environment 'LIMITS_ACTIONS_SEQUENCE_MAXLENGTH', '50'
    }
}
